name: Release (x86_64 linux)

# Manual. Produces the toolchain a user installs: the `neon` binary with the
# sysroot (include/, lib/<flavor>/, stdlib/) they resolve relative to themselves, packaged
# in the install layout, as a workflow artifact. Nothing is published anywhere by this
# workflow. The VS Code extension has its own workflow (vscode.yml), so it can ship without
# cutting a toolchain release.
#
# One workflow per target: an artifact is native to the machine that built it (the runtime
# archives are that platform's object code, and the arm64/Apple Clang archive is only
# LTO-usable when built on macOS — see runtime/CMakeLists.txt), so each target builds on its
# own runner. Separate workflows rather than a matrix so a linux-only cut doesn't spin up a
# macOS runner; the mac half lives in release-macos.yml and the two are dispatched
# independently. Keep the steps here in sync with it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # The menu end to end: rt (archives) -> cargo build --release -> bundle -> dist.
      # tools/dist.sh is the one definition of the install layout, shared with the
      # Dockerfile. (`neon-lsp` ships from its own repo now, so it is not bundled here.)
      - name: Build and stage prefix
        run: |
          set -eux
          prefix=neon-x86_64-linux
          cargo make dist
          mv target/dist "$prefix"
          tar -czf "$prefix.tar.gz" "$prefix"

      # A shipped toolchain that only breaks when a user runs it is worse than a failed
      # build. `doctor` compiles and runs a smoke program end to end.
      - name: Smoke test the package
        run: |
          set -eux
          cd neon-x86_64-linux
          NEON_SYSROOT="$PWD" ./bin/neon doctor

      - uses: actions/upload-artifact@v4
        with:
          name: neon-x86_64-linux
          path: neon-x86_64-linux.tar.gz

      # Publish the packaged toolchain to a GitHub Release — what install.sh's prebuilt
      # path downloads. Dispatch this and the other target for the same tag; both assets
      # attach to the one release.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --notes "Neon toolchain ${{ inputs.tag }}"
          gh release upload "${{ inputs.tag }}" neon-x86_64-linux.tar.gz --clobber
