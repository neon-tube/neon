name: CI

# The compiler and the runtime, on every push to main and every pull request. The runtime
# has no separate test binary — it is exercised end to end by the `backend_run` corpus,
# which compiles each Neon program, links it against the (sanitized) runtime archive, runs
# it, and checks its output. So one `cargo nextest run` covers both.
#
#
# `runtime-windows` is the third job, and it is the only one that builds the runtime for a
# platform this repo's primary CI does not run on. It is not a duplicate of the Linux jobs:
# what it checks is that the runtime's platform seam (`runtime/src/platform.h`) still
# compiles and still behaves, under mingw-w64 and under MSVC. See the job's own comment for
# what each toolchain can and cannot prove there.
#
# fuzz/ and verify/ (the CBMC models live under runtime/models, driven from verify/) are
# deliberately not here: both are detached workspaces needing their own toolchains
# (cargo-fuzz wants nightly + sanitizers, Kani ships its own backend), and the root
# workspace excludes them, so a plain `cargo build`/`nextest` never touches them.

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry and the target directory keyed on the lockfile, so a
      # green run reuses the previous one's compiled dependencies and runtime archives.
      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # cmake + gcc drive the runtime's CMake build (via neon-runtime's build script) and
      # link the corpus programs. Both are preinstalled on ubuntu-latest; assert it rather
      # than discover it missing three minutes into a build.
      - name: Check C toolchain
        run: cc --version && cmake --version

      # Builds the whole workspace, which builds the runtime archives as a side effect.
      - name: Build
        run: cargo build --workspace --locked

      # The compiler's own tests plus the runtime-linking corpus.
      - name: Test
        run: cargo nextest run --workspace --locked

  # The C runtime's own tinyunit unit tests, under ASan/UBSan. Separate from the cargo run
  # because they are a CMake build gated behind `-DNEON_RT_TESTS=ON` (off in every normal
  # build, so `cargo build` never pays for them) and pull tinyunit over the network.
  # Not fuzz and not the CBMC models — those stay out, as asked.
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cmake, gcc are preinstalled on ubuntu-latest; git (present) is needed for the
      # FetchContent pull of tinyunit.
      - name: Check C toolchain
        run: cmake --version && gcc --version

      - name: Configure
        run: >
          cmake -S runtime -B runtime/build-tests
          -DNEON_RT_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build runtime/build-tests --target neon_rt_tests

      # tinyunit forks per test: a leak (LeakSanitizer at exit) or a UB finding
      # (-fno-sanitize-recover) makes that test's child exit non-zero, which fails the run;
      # ctest surfaces the non-zero exit. `-V` prints tinyunit's per-test list on every run,
      # not just failures, so a green CI log still shows what ran.
      - name: Test
        run: ctest --test-dir runtime/build-tests -V

      # The portability smoke test, here as well as in the Windows job. Its assertions hold
      # on every platform, and running it where the archive is built anyway means it cannot
      # rot between Windows runs — a file whose only driver is the job you are least likely
      # to read is a file nobody notices has stopped compiling.
      - name: Portability smoke test
        run: |
          cmake -S runtime -B runtime/build-archive -DCMAKE_BUILD_TYPE=None -DCMAKE_C_COMPILER=gcc
          cmake --build runtime/build-archive --target neon_rt
          gcc -std=c11 -Wall -Wextra -Werror -O2 runtime/tests/portability_smoke.c \
            runtime/build-archive/libneon_rt.a -Iruntime/include -o smoke -lm
          ./smoke > out.txt
          test "$(wc -c < out.txt)" = "3" || { echo "stdout was newline-translated"; od -c out.txt; exit 1; }

  # The C runtime on Windows. Two toolchains, because they answer different questions and
  # only one of them can answer both.
  #
  #   * mingw-w64 gcc builds the archives *and* links a program that runs, so this job
  #     proves behaviour, not just that the source parses. The smoke test below is the
  #     shape of every Windows-specific bug the port had to fix: a byte count that changes
  #     because the CRT translated a newline, and a path that names a different file
  #     because it was decoded in the ANSI code page.
  #   * MSVC compiles the same sources under `/W4 /WX`. It cannot go further than an
  #     archive: `cli/src/emit.rs` builds one gcc-shaped argv (`-o`, `-I`, a `.a` passed
  #     positionally) and `cc_flavor` has no third answer, so `neon build --cc cl.exe`
  #     is not a thing that can work yet. Compiling the runtime is the part that *is*
  #     checkable, and it is the part that rots silently.
  #
  # The tinyunit suite DOES run here, which it could not while `EXPECT_EXIT` was a `fork`
  # and Windows had none. tinyunit now re-executes its own image per test and replays the
  # body to the death site under test; the neon side needed no change for it, because the
  # temp files, the stream capture and the constructors were already ported. Note what the
  # replay costs: the child rebuilds the state a forked child would have inherited, so a
  # death test whose body is not deterministic up to the site would diverge here and not on
  # POSIX. Every one of ours is a one-liner.
  #
  # The MSVC step below stops at the archive, and tinyunit is NOT the reason. tinyunit
  # builds and passes under cl.exe — it plants a pointer in `.CRT$XCU` where GNU compilers
  # get `__attribute__((constructor))`, and its own CI runs four MSVC jobs green. What is
  # unproven is whether *this* runtime's sources and this repo's CMake branch compile there,
  # which is exactly what that step exists to find out. If it goes green, adding
  # `-DNEON_RT_TESTS=ON` and a `ctest` to it is the next step and nothing in tinyunit stands
  # in the way.
  runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `make` is in this list because cmake's "Unix Makefiles" generator looks for a
      # program called `make`, and msys2 installs none by default: the first run of this job
      # failed at configure with "unable to find a build program". `mingw-w64-x86_64-make`
      # would not have fixed it -- that one is named `mingw32-make`.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make

      # `-DCMAKE_BUILD_TYPE=None` and nothing else, matching what `runtime/build.rs` does:
      # the variants carry hand-picked flags and cmake must not inject its own. The
      # sanitized archive is skipped by the CMakeLists itself here — mingw-w64 ships no
      # libasan, and the probe is what notices.
      - name: Build the runtime archives (mingw-w64 gcc)
        shell: msys2 {0}
        run: |
          cmake -S runtime -B runtime/build-mingw -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=None -DCMAKE_C_COMPILER=gcc
          cmake --build runtime/build-mingw

      # Behaviour, not just compilation. `runtime/tests/portability_smoke.c` links the
      # archive like a real program and checks the properties a Windows CRT quietly breaks;
      # see its header for what each one is and how sharp it is. It is not part of the
      # tinyunit suite and is built here directly.
      - name: Smoke-test the archive
        shell: msys2 {0}
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 runtime/tests/portability_smoke.c \
            runtime/build-mingw/libneon_rt.a -Iruntime/include -o smoke.exe -lm
          # Redirected, so stdout is a pipe rather than a console: exactly where a `\r`
          # the runtime did not write would show up.
          ./smoke.exe > out.txt
          # Three bytes -- "ok\n" -- and not four.
          test "$(wc -c < out.txt)" = "3" || { echo "stdout was newline-translated"; od -c out.txt; exit 1; }
          cat out.txt

      # The unit tests, on Windows, for real — 89 of them including the death tests, which
      # are the ones that could not run here before. Uninstrumented: mingw-w64 ships no
      # sanitizer runtime, so the CMakeLists' probe drops ASan/UBSan and with them the
      # per-test leak check. The Linux job is where those still hold; this job proves the
      # suite *runs on Windows*, which is a different claim and the one that was missing.
      - name: Unit tests (mingw-w64 gcc)
        shell: msys2 {0}
        run: |
          cmake -S runtime -B runtime/build-wintests -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=None -DNEON_RT_TESTS=ON
          cmake --build runtime/build-wintests
          ctest --test-dir runtime/build-wintests --output-on-failure -V

      # Compile-only, and deliberately so: see the job comment. The MSVC branch of
      # `runtime/CMakeLists.txt` is what is under test here, `/W4 /WX` included.
      #
      # NON-GATING UNTIL IT HAS BEEN GREEN ONCE, and that is the point of it rather than a
      # hedge. Every line it exercises — `__declspec(noreturn)`, `__forceinline`, the
      # `/wd4204 /wd4221` suppressions — was written by someone with no `cl.exe` to run it
      # against, so its first run is an EXPERIMENT and its result is the first real evidence
      # anyone has. Blocking the repo on a prediction would be asserting the answer; letting
      # it report gets the answer. Drop `continue-on-error` the day it passes, and if it
      # cannot be made to pass, delete the MSVC branch rather than leaving it to rot behind
      # a permanently amber step.
      - uses: ilammy/msvc-dev-cmd@v1
        continue-on-error: true

      - name: Compile the runtime archives (MSVC, unproven)
        continue-on-error: true
        shell: cmd
        run: |
          cmake -S runtime -B runtime/build-msvc -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=None -DCMAKE_C_COMPILER=cl
          cmake --build runtime/build-msvc
