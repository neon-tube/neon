name: CI

# The compiler and the runtime, on every push to main and every pull request. The runtime
# has no separate test binary — it is exercised end to end by the `backend_run` corpus,
# which compiles each Neon program, links it against the (sanitized) runtime archive, runs
# it, and checks its output. So one `cargo nextest run` covers both.
#
#
# `runtime-windows` is the third job, and it is the only one that builds the runtime for a
# platform this repo's primary CI does not run on. It is not a duplicate of the Linux jobs:
# what it checks is that the runtime's platform seam (`runtime/src/platform.h`) still
# compiles and still behaves under mingw-w64 -- archives, the smoke test, and the unit
# suite. See the job's own comment for why the GNU-ABI toolchain is the one covered.
#
# fuzz/ and verify/ (the CBMC models live under runtime/models, driven from verify/) are
# deliberately not here: both are detached workspaces needing their own toolchains
# (cargo-fuzz wants nightly + sanitizers, Kani ships its own backend), and the root
# workspace excludes them, so a plain `cargo build`/`nextest` never touches them.

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry and the target directory keyed on the lockfile, so a
      # green run reuses the previous one's compiled dependencies and runtime archives.
      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest + cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-make

      # cmake + gcc build the runtime archives (the `rt` task) and link the corpus
      # programs. Both are preinstalled on ubuntu-latest; assert it rather than discover
      # it missing three minutes into a build.
      - name: Check C toolchain
        run: cc --version && cmake --version

      # The menu: rt (archives) -> cargo build -> bundle -> nextest. The archives are
      # produced by the top-level make, never by a build script; `runtime/build.rs` only
      # verifies they are present and fresh.
      - name: Test
        run: cargo make nextest

  # The C runtime's own tinyunit unit tests, under ASan/UBSan. Separate from the cargo run
  # because they are a CMake build gated behind `-DNEON_RT_TESTS=ON` (off in every normal
  # build, so `cargo build` never pays for them) and pull tinyunit over the network.
  # Not fuzz and not the CBMC models — those stay out, as asked.
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cmake, gcc are preinstalled on ubuntu-latest; git (present) is needed for the
      # FetchContent pulls (tinyunit, llhttp).
      - name: Check C toolchain
        run: cmake --version && gcc --version

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # tinyunit forks per test: a leak (LeakSanitizer at exit) or a UB finding
      # (-fno-sanitize-recover) makes that test's child exit non-zero, which fails the
      # run. The task runs the suite under BOTH IO engines.
      - name: C unit tests
        run: cargo make rt-tests

      # The portability smoke, here as well as in the Windows job — flags come from
      # runtime/flags/, the same authority the archives are built with.
      - name: Portability smoke test
        run: cargo make smoke

  # The C runtime on Windows, via mingw-w64 gcc. It builds the archives *and* links a
  # program that runs, so this job proves behaviour, not just that the source parses. The
  # smoke test below is the shape of every Windows-specific bug the port had to fix: a byte
  # count that changes because the CRT translated a newline, and a path that names a
  # different file because it was decoded in the ANSI code page.
  #
  # MSVC (cl.exe) is deliberately NOT built here. The supported Windows toolchain is the
  # GNU-ABI one — mingw now, clang targeting `*-windows-gnu` if that is ever wanted — and
  # `cli/src/emit.rs` only knows how to drive a gcc-shaped `cc` anyway, so `neon build`
  # under cl.exe cannot work yet regardless. A compile-only cl.exe check was more Windows
  # portability debt (C11 atomics behind `/experimental`, no pthreads, its own `/WX` set)
  # than a runtime with no MSVC ship target could justify carrying green.
  #
  # The tinyunit suite DOES run here, which it could not while `EXPECT_EXIT` was a `fork`
  # and Windows had none. tinyunit now re-executes its own image per test and replays the
  # body to the death site under test; the neon side needed no change for it, because the
  # temp files, the stream capture and the constructors were already ported. Note what the
  # replay costs: the child rebuilds the state a forked child would have inherited, so a
  # death test whose body is not deterministic up to the site would diverge here and not on
  # POSIX. Every one of ours is a one-liner.
  runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `make` is in this list because cmake's "Unix Makefiles" generator looks for a
      # program called `make`, and msys2 installs none by default: the first run of this job
      # failed at configure with "unable to find a build program". `mingw-w64-x86_64-make`
      # would not have fixed it -- that one is named `mingw32-make`.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make

      # `-DCMAKE_BUILD_TYPE=None` and nothing else, matching what `runtime/build.rs` does:
      # the variants carry hand-picked flags and cmake must not inject its own. The
      # sanitized archive is skipped by the CMakeLists itself here — mingw-w64 ships no
      # libasan, and the probe is what notices.
      - name: Build the runtime archives (mingw-w64 gcc)
        shell: msys2 {0}
        run: |
          cmake -S runtime -B runtime/build-mingw -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=None -DCMAKE_C_COMPILER=gcc
          cmake --build runtime/build-mingw

      # Behaviour, not just compilation. `runtime/tests/portability_smoke.c` links the
      # archive like a real program and checks the properties a Windows CRT quietly breaks;
      # see its header for what each one is and how sharp it is. It is not part of the
      # tinyunit suite and is built here directly.
      - name: Smoke-test the archive
        shell: msys2 {0}
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 runtime/tests/portability_smoke.c \
            runtime/build-mingw/libneon_rt.a -Iruntime/include -o smoke.exe -lm
          # Redirected, so stdout is a pipe rather than a console: exactly where a `\r`
          # the runtime did not write would show up.
          ./smoke.exe > out.txt
          # Three bytes -- "ok\n" -- and not four.
          test "$(wc -c < out.txt)" = "3" || { echo "stdout was newline-translated"; od -c out.txt; exit 1; }
          cat out.txt

      # The unit tests, on Windows, for real — 89 of them including the death tests, which
      # are the ones that could not run here before. Uninstrumented: mingw-w64 ships no
      # sanitizer runtime, so the CMakeLists' probe drops ASan/UBSan and with them the
      # per-test leak check. The Linux job is where those still hold; this job proves the
      # suite *runs on Windows*, which is a different claim and the one that was missing.
      - name: Unit tests (mingw-w64 gcc)
        shell: msys2 {0}
        run: |
          cmake -S runtime -B runtime/build-wintests -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=None -DNEON_RT_TESTS=ON
          cmake --build runtime/build-wintests
          ctest --test-dir runtime/build-wintests --output-on-failure -V
